AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Serverless Employee Management System Infrastructure (DynamoDB, S3, Lambda, API Gateway, Cognito)'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

Resources:
  # 1. DynamoDB Table
  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Employees
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: empId
          AttributeType: S
      KeySchema:
        - AttributeName: empId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: EmployeeManagement

  # 2. S3 Bucket for Profile Photos
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000

  # 3. Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'EmployeeUserPool-${Environment}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: EmployeeAppClient
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # 4. IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'EmployeeAppLambdaRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

Outputs:
  DynamoDBTableName:
    Description: DynamoDB Employees Table Name
    Value: !Ref EmployeesTable
  S3PhotoBucketName:
    Description: S3 Bucket Name for Employee Photos
    Value: !Ref PhotoBucket
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
